{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Фильмотека{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'films/styles.css' %}">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="{% url 'film_list' %}">
        <span class="brand-mark">F</span>
        <span>Фильмотека</span>
      </a>
      <nav class="topnav">
        <a href="{% url 'film_list' %}">Каталог</a>
        <a class="button button-primary" href="{% url 'film_create' %}">Добавить фильм</a>
      </nav>
    </header>

    <main>
      {% if messages %}
        <section class="messages">
          {% for message in messages %}
            <div class="message">{{ message }}</div>
          {% endfor %}
        </section>
      {% endif %}

      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
